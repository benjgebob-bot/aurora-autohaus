<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Autohaus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .hero {
            background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.95)), url('https://picsum.photos/id/1074/1920/1080') center/cover fixed;
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white font-['Inter']">

    <!-- NAV -->
    <nav class="fixed w-full bg-black/90 backdrop-blur border-b border-zinc-800 z-50">
        <div class="max-w-7xl mx-auto px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-4xl font-black text-amber-400">A</span>
                <div class="text-xl font-semibold tracking-wider">AURORA AUTOHAUS</div>
            </div>
            <div class="flex gap-8 text-sm font-medium">
                <a href="#" class="hover:text-amber-400">Startseite</a>
                <a href="#" class="hover:text-amber-400">Fahrzeuge</a>
                <a href="#" class="hover:text-amber-400">Termine</a>
                <a href="#" class="hover:text-amber-400">Kontakt</a>
            </div>
            <button class="bg-amber-400 text-black px-8 py-2.5 text-sm font-semibold hover:bg-amber-300">SHOWROOM</button>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero flex items-center">
        <div class="max-w-7xl mx-auto px-8 grid md:grid-cols-2 gap-12 items-center">
            <div>
                <p class="text-amber-400 text-sm tracking-widest">WILLKOMMEN BEI</p>
                <h1 class="text-7xl font-black tracking-tighter leading-none mt-2">AURORA AUTOHAUS</h1>
                <p class="mt-8 text-zinc-400">Exklusive Fahrzeuge • Erstklassiger Service • Osnabrück Roleplay</p>
                <button class="mt-12 bg-amber-400 text-black px-10 py-4 font-semibold hover:bg-amber-300">ZUM SHOWROOM</button>
            </div>
            <div class="hidden md:block">
                <img src="https://picsum.photos/id/1074/900/550" class="rounded-xl shadow-2xl" alt="Luxuswagen">
            </div>
        </div>
    </section>

</body>
</html>

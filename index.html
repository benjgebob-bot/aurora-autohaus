<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <title>Aurora Autohaus | Osnabrück Roleplay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .hero { background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), url('https://picsum.photos/id/1015/1920/1080') center/cover no-repeat; }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-x-hidden">

    <!-- NAV -->
    <nav class="bg-black/90 backdrop-blur fixed w-full z-50 border-b border-yellow-500/30">
        <div class="max-w-7xl mx-auto px-8 py-5 flex justify-between items-center">
            <img src="https://i.imgur.com/DEINELOGOURL.png" alt="Aurora Logo" class="h-12"> <!-- Hier später echtes Logo -->
            <div class="flex gap-8 text-sm uppercase tracking-widest font-medium">
                <a href="#" class="hover:text-yellow-400 transition">Startseite</a>
                <a href="#" class="hover:text-yellow-400 transition">Über uns</a>
                <a href="#" class="hover:text-yellow-400 transition">Fahrzeuge</a>
                <a href="#" class="hover:text-yellow-400 transition">Vorbestellung</a>
                <a href="#" class="hover:text-yellow-400 transition">Termine</a>
                <a href="#" class="hover:text-yellow-400 transition">Kontakt</a>
            </div>
            <button class="bg-yellow-400 hover:bg-yellow-300 text-black px-8 py-3 text-sm font-bold tracking-widest transition">SHOWROOM</button>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero min-h-screen flex items-center pt-20">
        <div class="max-w-7xl mx-auto px-8 grid md:grid-cols-2 gap-12 items-center">
            <div>
                <p class="text-yellow-400 tracking-[4px] text-sm mb-3">OSNABRÜCK ROLEPLAY</p>
                <h1 class="text-7xl md:text-8xl font-black leading-none mb-6">AURORA<br>AUTOH AUS</h1>
                <p class="text-2xl text-yellow-400 mb-4">EXKLUSIVITÄT | QUALITÄT | VERTRAUEN</p>
                <p class="text-lg text-zinc-300 max-w-md">Das Aurora Autohaus steht für höchste Qualität, exklusive Fahrzeuge und erstklassigen Service.</p>
                <button class="mt-10 border border-yellow-400 text-yellow-400 px-10 py-4 hover:bg-yellow-400 hover:text-black font-bold tracking-widest transition">ZU UNSEREN FAHRZEUGEN →</button>
            </div>
            <div class="hidden md:block">
                <!-- Großes Auto Bild kommt hier später besser -->
            </div>
        </div>
    </section>

    <footer class="py-12 text-center text-zinc-500 text-sm border-t border-zinc-800">
        © 2026 Aurora Autohaus • Osnabrück Roleplay
    </footer>
</body>
</html>

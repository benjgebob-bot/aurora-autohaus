<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Autohaus • Osnabrück Roleplay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .hero {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.9)), url('https://picsum.photos/id/1074/1920/1080') center/cover fixed;
            min-height: 100vh;
        }
        .luxus-font { font-family: 'Playfair Display', serif; }
        .gold { color: #d4af37; }
    </style>
</head>
<body class="bg-zinc-950 text-white">

    <!-- NAV -->
    <nav class="fixed w-full bg-black/95 border-b border-amber-500/30 z-50">
        <div class="max-w-7xl mx-auto px-8 py-6 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <span class="text-5xl font-black gold">A</span>
                <div>
                    <p class="text-4xl font-bold tracking-widest luxus-font">AURORA</p>
                    <p class="text-amber-400 text-sm -mt-1 tracking-widest">AUTOH AUS</p>
                </div>
            </div>
            <div class="flex gap-8 text-sm uppercase tracking-widest font-medium">
                <a href="#" class="hover:gold">Startseite</a>
                <a href="#" class="hover:gold">Über uns</a>
                <a href="#" class="hover:gold">Fahrzeuge</a>
                <a href="#" class="hover:gold">Vorbestellung</a>
                <a href="#" class="hover:gold">Termine</a>
                <a href="#" class="hover:gold">Kontakt</a>
            </div>
            <button class="bg-amber-400 text-black px-8 py-3 font-bold hover:bg-amber-300 transition">SHOWROOM</button>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero flex items-center">
        <div class="max-w-7xl mx-auto px-8 grid md:grid-cols-2 gap-16 items-center">
            <div class="pt-20">
                <p class="text-amber-400 uppercase tracking-[3px] text-sm mb-4">Willkommen bei</p>
                <h1 class="text-7xl md:text-8xl font-black luxus-font leading-none">AURORA<br>AUTOH AUS</h1>
                <p class="text-2xl gold mt-6">Exklusivität • Qualität • Vertrauen</p>
                <p class="mt-8 text-zinc-300 max-w-md">Das Aurora Autohaus steht für höchste Qualität, exklusive Fahrzeuge und erstklassigen Service.</p>
                <button class="mt-12 border-2 border-amber-400 px-12 py-5 text-lg font-bold hover:bg-amber-400 hover:text-black transition">ZU UNSEREN FAHRZEUGEN →</button>
            </div>
            <div class="hidden md:block">
                <img src="https://picsum.photos/id/1074/850/520" class="rounded-2xl shadow-2xl" alt="Luxusfahrzeug">
            </div>
        </div>
    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Autohaus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero {
            background: linear-gradient(to right, rgba(0,0,0,0.9), rgba(0,0,0,0.6)), url('https://picsum.photos/id/1074/2000/1200') right/cover;
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-black text-white font-sans">

    <!-- NAV -->
    <nav class="fixed w-full bg-black/95 border-b border-yellow-500/30 z-50">
        <div class="max-w-7xl mx-auto px-8 py-6 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-4xl font-black text-yellow-400">A</span>
                <div class="leading-none">
                    <p class="text-3xl font-bold tracking-wider">AURORA</p>
                    <p class="text-sm text-yellow-400 tracking-widest -mt-1">AUTOH AUS</p>
                </div>
            </div>
            <div class="flex gap-8 uppercase text-sm tracking-widest">
                <a href="#" class="hover:text-yellow-400">Startseite</a>
                <a href="#" class="hover:text-yellow-400">Über uns</a>
                <a href="#" class="hover:text-yellow-400">Fahrzeuge</a>
                <a href="#" class="hover:text-yellow-400">Vorbestellung</a>
                <a href="#" class="hover:text-yellow-400">Termine</a>
                <a href="#" class="hover:text-yellow-400">Kontakt</a>
            </div>
            <button class="bg-yellow-400 text-black px-8 py-3 text-sm font-bold hover:bg-amber-300">SHOWROOM</button>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero flex items-center">
        <div class="max-w-7xl mx-auto px-8 grid md:grid-cols-2 gap-12 items-center">
            <div>
                <p class="uppercase text-yellow-400 text-sm tracking-widest mb-4">Willkommen bei</p>
                <h1 class="text-7xl font-black tracking-tighter leading-none">AURORA<br>AUTOH AUS</h1>
                <p class="mt-6 text-xl text-zinc-300">Exklusivität | Qualität | Vertrauen</p>
                <p class="mt-8 text-zinc-400 max-w-md">Das Aurora Autohaus steht für höchste Qualität, exklusive Fahrzeuge und erstklassigen Service.</p>
                <button class="mt-12 border-2 border-yellow-400 px-10 py-4 hover:bg-yellow-400 hover:text-black font-bold">ZU UNSEREN FAHRZEUGEN →</button>
            </div>
            <div class="hidden md:block text-right">
                <!-- Hier kommt später das große Auto -->
                <img src="https://picsum.photos/id/1015/800/500" alt="Luxus Auto" class="rounded shadow-2xl">
            </div>
        </div>
    </section>

</body>
</html>

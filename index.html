<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Autohaus • Osnabrück Roleplay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        .hero {
            background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.95)), url('https://picsum.photos/id/1074/1920/1080') center/cover fixed;
            min-height: 100vh;
        }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .luxus { font-family: 'Inter', sans-serif; font-weight: 700; }
    </style>
</head>
<body class="bg-zinc-950 text-white">

    <!-- TOP BAR -->
    <nav class="bg-zinc-900 border-b border-zinc-800 fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-8">
                <div class="flex items-center gap-3">
                    <span class="text-4xl font-black text-amber-400">A</span>
                    <div class="text-xl font-semibold tracking-wider luxus">AURORA AUTOH AUS</div>
                </div>
                <div class="flex gap-8 text-sm font-medium">
                    <a href="#" class="hover:text-amber-400">Home</a>
                    <a href="#" class="hover:text-amber-400">Fahrzeuge</a>
                    <a href="#" class="hover:text-amber-400">Termine</a>
                    <a href="#" class="hover:text-amber-400">Discord</a>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <button class="text-sm font-medium hover:text-amber-400">Login</button>
                <button class="bg-amber-400 text-black px-6 py-2.5 rounded-full font-semibold hover:bg-amber-300">SHOWROOM</button>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero flex items-center pt-20">
        <div class="max-w-7xl mx-auto px-8 grid md:grid-cols-2 gap-16 items-center">
            <div>
                <p class="text-amber-400 uppercase tracking-widest text-sm mb-4">Willkommen bei</p>
                <h1 class="text-7xl font-black tracking-tighter leading-none luxus">AURORA AUTOH AUS</h1>
                <p class="mt-8 text-zinc-400">Exklusive Fahrzeuge und erstklassiger Service im Osnabrück Roleplay.</p>
                <button class="mt-12 bg-amber-400 text-black px-10 py-4 font-semibold rounded hover:bg-amber-300">ZUM SHOWROOM</button>
            </div>
            <div class="hidden md:block">
                <img src="https://picsum.photos/id/1074/850/520" class="rounded-2xl shadow-2xl" alt="Luxuswagen">
            </div>
        </div>
    </section>

</body>
</html>

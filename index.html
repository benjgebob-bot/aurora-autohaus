<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Autohaus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero { background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.85)), url('https://picsum.photos/id/1074/1920/1080') center/cover; }
    </style>
</head>
<body class="bg-zinc-950 text-white">

    <!-- NAV -->
    <nav class="bg-black border-b border-amber-500/30 fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-6xl font-black text-amber-400">A</span>
                <div>
                    <p class="text-4xl font-bold tracking-widest">AURORA</p>
                    <p class="text-amber-400 text-sm -mt-2">AUTOH AUS</p>
                </div>
            </div>
            <div class="flex gap-8 uppercase text-sm font-medium tracking-wider">
                <a href="#" class="hover:text-amber-400">Startseite</a>
                <a href="#" class="hover:text-amber-400">Über uns</a>
                <a href="#" class="hover:text-amber-400">Fahrzeuge</a>
                <a href="#" class="hover:text-amber-400">Vorbestellung</a>
                <a href="#" class="hover:text-amber-400">Termine</a>
                <a href="#" class="hover:text-amber-400">Kontakt</a>
            </div>
            <button class="bg-amber-400 text-black px-8 py-3 font-bold hover:bg-amber-300">SHOWROOM</button>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero min-h-screen flex items-center">
        <div class="max-w-7xl mx-auto px-8 grid md:grid-cols-2 gap-12">
            <div class="pt-20">
                <p class="text-amber-400 uppercase tracking-widest mb-4">Willkommen bei</p>
                <h1 class="text-7xl font-black tracking-tighter">AURORA<br>AUTOH AUS</h1>
                <p class="text-2xl text-amber-400 mt-4">Exklusivität | Qualität | Vertrauen</p>
                <p class="mt-8 max-w-md">Das Aurora Autohaus steht für höchste Qualität, exklusive Fahrzeuge und erstklassigen Service.</p>
                <button class="mt-12 border-2 border-amber-400 px-12 py-5 text-lg font-bold hover:bg-amber-400 hover:text-black">ZU UNSEREN FAHRZEUGEN →</button>
            </div>
            <div class="hidden md:flex justify-end items-center">
                <img src="https://picsum.photos/id/1074/800/500" alt="Luxus Auto" class="rounded-2xl shadow-2xl">
            </div>
        </div>
    </section>

</body>
</html>

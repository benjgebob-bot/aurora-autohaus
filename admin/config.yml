backend:
  name: github
  repo: benjgebob-bot/aurora-autohaus   # ändere falls dein Username anders ist

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "pages"
    label: "Seiten"
    files:
      - file: "index.html"
        label: "Startseite"
        fields:
          - {label: "Hero Titel", name: "title", widget: "string"}
          - {label: "Hero Untertitel", name: "subtitle", widget: "string"}
          - {label: "Hero Bild", name: "hero_image", widget: "image"}
          - {label: "Beschreibung", name: "description", widget: "text"}
